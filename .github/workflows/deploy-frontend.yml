name: Deploy frontend to GitHub Pages

on:
  # POSTed by the Prefect flow's final stage once training publishes new weights.
  # repository_dispatch only ever triggers workflows on the default branch.
  repository_dispatch:
    types: [model-updated]
  push:
    branches: [main]
    paths:
      - "services/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  # Manual escape hatch. The Prefect flow runs on a laptop, so it cannot be the
  # only way to deploy.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required by actions/deploy-pages, independently of AWS auth

# Never run two Pages deploys at once, and never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  S3_BUCKET: cr-games-bucket
  MODEL_KEY: model-weights/model_int8.onnx
  MODEL_METADATA_KEY: model-weights/model_int8.metadata.json
  CARD_MAP_KEY: frontend-assets/card_to_token_id.json
  PNG_URLS_KEY: frontend-assets/png_urls.json

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A dedicated IAM user whose only permission is s3:GetObject on the four
      # keys above -- the same bucket holds the Postgres dump.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Downloads the four artifacts, hashes each into public/ under a
      # content-addressed name, and writes public/model-manifest.json. This is
      # the same command a developer runs locally, reading the same env vars, so
      # CI and laptops cannot produce different manifests. It exits non-zero if a
      # required object is missing -- which matters, because vite build would
      # otherwise happily produce a model-less site.
      - name: Fetch assets and write manifest
        run: npm run prepare-assets
        env:
          BUILD_COMMIT: ${{ github.sha }}

      # GITHUB_REPOSITORY is set automatically, so vite.config.ts resolves base
      # to /win_predictor_pipeline/ with no extra plumbing.
      - name: Build
        run: npm run build

      # Belt and braces: the Actions-based deployment does not run Jekyll, but
      # this keeps branch-based publishing from silently dropping directories.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # NOTE: `path` is not affected by defaults.run.working-directory, which
      # only applies to `run:` steps -- it needs the full path from the repo root.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: services/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
