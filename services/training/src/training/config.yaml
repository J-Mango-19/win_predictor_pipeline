# dataset download & train/val split
data:
  train_fraction: 0.8   # 80% train / 20% validation
  shuffle: true         # false -> chronological split (validate on the most recent games)
  seed: 42
  local_dir: "./data"

# model architecture (see models/transformer.py)
model:
  d_model: 256
  n_heads: 4
  n_sxa_blocks: 3
  n_masked_xa_blocks: 1
  mlp_hidden: 256
  set_size: 8
  dropout: 0.0

# optimization
training:
  n_epochs: 3
  batch_size: 8192 # this is a hardware constriant -- multiply this with grad_accumulation_steps to get the real batch size
  lr: 2e-4
  weight_decay: 1e-2
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  grad_accumulation_steps: 4
  compile: true
  dataloader_workers: 0

# where the trained model lands
output:
  checkpoint_dir: "./checkpoints"
  model_filename: "model_int8.onnx"
